<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CYBERDECK starter — clickable timestamped list over audio</title>
<!-- Inline the CSS for single-file portability, or <link> it when serving a dir. -->
<style>/* paste ~/themes/cyberdeck/cyberdeck.css here for a self-contained page */</style>
<link rel="stylesheet" href="cyberdeck.css">
</head><body>
<header>
  <h1>PROJECT &middot; SECTION <small>N items &middot; click any line to jump the audio</small></h1>
  <audio id="p" controls preload="auto" src="audio.m4a"></audio>
  <div class="legend">red-edged rows = flagged &middot; colors = category</div>
</header>

<!-- one .row per item: onclick="s(SECONDS)" — .t stamp, .v label, .x content -->
<div class="row" onclick="s(0.0)"><span class="t">0:00</span>
  <span class="v" style="color:var(--cat-cyan)">LABEL</span><span class="x">First item text.</span></div>
<div class="row narr" onclick="s(4.2)"><span class="t">0:04</span>
  <span class="v">dim</span><span class="x">De-emphasized row (narration, comment, context).</span></div>
<div class="row fixed" onclick="s(9.7)"><span class="t">0:09</span>
  <span class="v" style="color:var(--cat-magenta)">WRONG</span>
  <span class="fix">&rarr; <b style="color:var(--cat-orange)">RIGHT</b></span>
  <span class="x">Flagged row with a correction badge.</span></div>

<script>
function s(t){const p=document.getElementById('p');p.currentTime=t;p.play();
document.querySelectorAll('.playing').forEach(e=>e.classList.remove('playing'));
if(event)event.currentTarget.classList.add('playing');}
</script></body></html>
